**시행일: 2026-09-09 · 최종 개정: 2026-11-16**
**개정 사유: 사업자 정보 공시 · 4단계 구독 상품(월/3개월/6개월/1년) 가격 반영**

본 약관은 라이프리오(LIFRIO, 이하 "회사")가 제공하는 모바일 애플리케이션(이하 "서비스")의 이용조건과 절차, 회사와 이용자 간의 권리·의무 및 책임사항 등을 규정함을 목적으로 합니다.

---

## 제1조 (목적)

이 약관은 회사가 제공하는 대학생 대상 커리어 설계 및 자기이해 학습 서비스 이용과 관련하여 회사와 이용자 간의 권리, 의무 및 책임사항을 규정함을 목적으로 합니다.

## 제2조 (용어의 정의)

1. **서비스**: 회사가 모바일 애플리케이션을 통해 제공하는 오디오 콘텐츠, 자기이해 진단, 커리어 설계 도구, 학습 진행 상황 관리 등 일체의 기능.
2. **이용자**: 본 약관에 따라 회사가 제공하는 서비스를 이용하는 회원 및 비회원.
3. **회원**: 회사에 개인정보를 제공하여 회원 등록을 한 자.
4. **콘텐츠**: 회사가 서비스를 통해 제공하는 오디오, 자막, 진단 결과, 텍스트, 이미지 등 일체의 저작물.

## 제3조 (약관의 게시와 개정)

약관은 서비스 초기 화면 또는 마이 페이지에 게시되며, 개정 시 적용일자 및 개정사유를 명시하여 최소 7일 이전(이용자에게 불리하거나 중대한 변경의 경우 30일 이전)부터 공지합니다.

## 제4조 (서비스의 제공 및 변경)

1. 제공 서비스:
   - 자기이해 진단 및 결과 조회
   - 커리어 관련 오디오/영상 콘텐츠 제공
   - 학습 진행 상황 및 회고 기록 관리
   - 태그·직무 추천 기반 개인화 콘텐츠 안내
   - 기타 회사가 정하는 서비스
2. 변경 시 사전에 공지합니다.

## 제5조 (서비스 이용시간)

연중무휴 1일 24시간 원칙. 정기 점검·증설 시 일시 중단 가능하며 사전 공지합니다.

## 제6조 (회원가입)

허위 정보 등록 등 사유 시 승낙 거절 또는 계약 해지 가능.

## 제7조 (회원 정보의 변경)

마이 페이지에서 언제든 수정. 변경사항은 즉시 수정 의무.

## 제8조 (이용자의 의무)

허위 등록·타인 정보 도용·지적재산권 침해·공서양속 반하는 정보 게시 등 금지.

## 제9조 (콘텐츠의 저작권)

1. 회사 제작 콘텐츠의 저작권은 회사에 귀속.
2. 회사의 사전 승낙 없이 영리 목적 이용·제3자 제공 금지.
3. "오늘의 뉴스 모아듣기" 등 외부 언론사 원문 요약 콘텐츠는 각 언론사가 저작권자이며, 회사는 공정 이용 범위 내에서 요약·오디오 변환 수행.

## 제10조 (유료 서비스)

1. 유료 서비스 종류:
   - **크레딧(CP) 패키지**: 1회성 소모 재화. 콘텐츠 언락·심화 리포트 등에 사용.
   - **구독**: 전체 직무 콘텐츠 자동 해제, 광고 제거, 출석 보너스 CP, 프리미엄 콘텐츠 접근권 등을 제공하는 자동 갱신 상품.
2. 결제는 Apple App Store 인앱 결제(IAP)를 통해 이루어지며, Apple 약관을 함께 적용.
3. 가격·구성은 결제 화면에 결제 전 명확히 고지.

## 제11조 (크레딧(CP) 정책)

1. **성격**: 서비스 내에서만 사용 가능한 소프트 재화. 현금 환급·양도·상속 불가.
2. **획득 경로**: 출석·일일 퀘스트·오늘의 리뷰·자기이해 콘텐츠 완청·보상형 광고 시청·현금 구매·구독 보너스 등.
3. **일일 획득 상한**: 반복 활동 CP 합산은 자정(Asia/Seoul) 기준 1일 150 CP 초과 불가. 일회성 보너스·현금 구매·업적 등은 상한 제외.
4. **소멸**: 회원 탈퇴 또는 서비스 종료 시 소멸. 1년 이상 미로그인 계정 CP 는 사전 안내 후 소멸 가능.
5. **환불**: 현금으로 구매한 CP 는 **미사용분에 한해** 구매 후 7일 이내 환불 가능. 소비된 CP 는 환불 제외. 환불은 Apple App Store 절차를 따름.
6. **지급 오류**: 서버 오류로 과도 지급된 CP 는 사전 통지 후 회수 가능.

## 제12조 (구독)

1. **상품 구성**: 월 구독 ₩8,900 / 3개월 구독 ₩19,900 / 6개월 구독 ₩29,900 / 연간 구독 ₩49,900. 각 상품의 상세 혜택·기간·자동 갱신 조건은 결제 화면에 명시.
2. **자동 갱신**: 결제일 기준 자동 갱신. 갱신 24시간 이전까지 해지하지 않으면 동일 상품으로 다음 기간 분 결제.
3. **해지**: iOS **설정 > Apple ID > 구독** 메뉴에서 언제든 가능. 해지 시 다음 결제 중단, 현재 기간 종료일까지 이용 유지.
4. **중도 환불**: 장기 구독(3개월/6개월/1년) 중도 해지 환불은 Apple App Store 환불 정책 적용.
5. **구독 혜택**: 전체 직무 role 자동 해제, 모든 광고 제거, 출석 보너스 CP, 프리미엄 콘텐츠 접근(별도 CP 20 소비), 스펙 리포트 본편 월 1회 포함.
6. **구독 종료 후**: 언락한 콘텐츠·획득 CP 는 유지, 구독 전용 혜택은 중단.

## 제13조 (환불 및 청약 철회)

1. 「전자상거래 등에서의 소비자보호에 관한 법률」에 따라 디지털 콘텐츠 미전송·미사용 시 결제일로부터 7일 이내 청약 철회 가능.
2. 청약 철회 제한:
   - 구매한 CP 를 이미 소비한 경우(소비분)
   - 구독 혜택을 이미 사용한 경우(해당 기간 분)
   - 리포트 발행 등 전송이 완료된 디지털 콘텐츠
3. 환불 신청: 앱 설정 > 문의하기 또는 Apple App Store 환불 센터.

## 제14조 (광고)

1. 무료 이용자 광고:
   - **세션 광고**: 앱 실행 시 세션당 1회 전면 광고.
   - **보상형 광고**: 완청 시 CP 지급. 일 4회 제한.
2. Google AdMob 네트워크 송출. 데이터 처리는 개인정보처리방침 참조.
3. 구독 중에는 광고 미노출.

## 제15조 (미성년자의 결제)

만 19세 미만 결제 시 법정대리인 동의 필요. 법정대리인은 Apple App Store 를 통해 결제 취소 신청 가능.

## 제16조 (서비스 이용의 제한 및 중지)

약관 위반·정상 운영 방해 시 경고·일시정지·영구이용정지 등 단계적 제한. 3개월 이상 미로그인 시 이용 제한 가능.

## 제17조 (계약 해지 및 이용 제한)

1. 마이 페이지 "계정 탈퇴" 로 계약 해지 신청 가능.
2. 해지 시 개인정보·학습 이력은 개인정보처리방침에 따라 처리.
3. 해지 시점의 **미사용 CP·구독 잔여 기간은 자동 소멸** (환불 대상 제외). 환불 필요 시 탈퇴 전 Apple App Store 환불 신청.

## 제18조 (면책조항)

1. 천재지변 등 불가항력 시 서비스 제공 책임 면제.
2. 자기이해 진단·커리어 추천은 참고 자료로, 심리 진단 또는 직업 상담을 대체하지 않음.
3. 이용자 상호간 또는 이용자-제3자 간 분쟁에 개입 의무 없음.
4. 제3자 광고 내용·거래 책임 없음.

## 제19조 (준거법 및 관할)

대한민국 법을 준거법으로 하며, 회사 본사 소재지를 관할하는 법원을 제1심 관할 법원으로 합니다.

## 제20조 (사업자 정보 공시)
